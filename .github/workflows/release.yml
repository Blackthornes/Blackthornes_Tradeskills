name: Release

# Publishing is driven by tags. Push a tag like v0.2.0 and this builds the
# player-facing zip and uploads it to whichever sites have a token configured.
# A site with no token is skipped silently, so this workflow is safe to merge
# before any account exists.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager builds the changelog from the commits since the last
          # tag, so it needs the history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip lupa

      - name: Syntax check
        run: python tools/syntaxcheck.py

      - name: Lint calls
        run: python tools/lintcalls.py

      - name: Tests
        run: python tools/runtests.py

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
