name: Guard saved data

# The pre-commit hook is the real protection, but git does not install hooks on
# clone, so this catches a snapshot that reaches GitHub from a clone where the
# hook was never set up.

on:
  push:
  pull_request:

jobs:
  snapshot:
    name: Data/Snapshot.lua is empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the snapshot carries no saved data
        run: sh tools/check-snapshot.sh < Data/Snapshot.lua
